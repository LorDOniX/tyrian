<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>3D shora</title>
  </head>
  <body>
    <main id="app" aria-label="Vesmírná loď – ovládání šipkami nebo WASD a střelba mezerníkem"></main>
    <aside class="info">
      <h1 id="level-title">Level 1 · Základna</h1>
      <p class="stats">Skóre <strong id="score">000000</strong> · Životy <strong id="lives">3</strong></p>
      <p id="section">1 / 3 · Formace</p>
      <progress id="progress" max="1" value="0" aria-label="Průběh úrovně"></progress>
      <p id="weapon-label">Zbraň · Jeden paprsek</p>
      <progress id="weapon-timer" max="12" value="0" hidden aria-label="Zbývající čas trojstřely"></progress>
      <p class="bonus-help"><span>◆ Trojstřela</span> · <span>+ Oprava</span></p>
      <p id="bonus-notice" role="status" aria-live="polite"></p>
      <p>WASD / šipky: pohyb · Mezerník: střelba · Esc: pauza</p>
    </aside>
    <aside id="boss-hud" class="boss-hud" hidden>
      <p id="boss-label">Velitel · 60 / 60</p>
      <progress id="boss-health" max="60" value="60" aria-label="Životy bosse"></progress>
    </aside>
    <div id="debug-tools" class="debug-tools" hidden><button id="debug-level2" type="button">Debug: start levelu 2</button> <button id="debug-boss2" type="button">Debug: boss levelu 2</button><p id="debug-airships"></p></div>
    <label class="terrain-toggle"><input id="terrain" type="checkbox" checked /> Terén</label>
    <label class="debug"><input id="debug" type="checkbox" /> Kolizní kruhy</label>
    <section id="overlay" class="overlay" hidden aria-label="Stav hry">
      <div><h2 id="message">Pauza</h2><p id="result"></p><button id="action" type="button">Pokračovat · Enter</button></div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
